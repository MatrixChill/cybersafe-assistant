<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1040 50%, #0d1b2a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0ff;
      overflow: hidden;
    }
    .container {
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shield {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
    }
    .shield svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.4));
    }
    .shield .pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      border-radius: 50%;
      border: 2px solid rgba(0, 200, 255, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #00c8ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #8899bb;
      margin-bottom: 32px;
    }
    .loader {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin: 0 auto;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #00c8ff, #a855f7);
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield">
      <div class="pulse"></div>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z" fill="url(#grad)" opacity="0.9"/>
        <path d="M10 15.5L7.5 13L6.09 14.41L10 18.33L18 10.33L16.59 8.92L10 15.5Z" fill="#fff"/>
        <defs>
          <linearGradient id="grad" x1="3" y1="2" x2="21" y2="24">
            <stop offset="0%" stop-color="#00c8ff"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1>CyberSafe</h1>
    <p>Iniciando proteção em tempo real...</p>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
</body>
</html>
