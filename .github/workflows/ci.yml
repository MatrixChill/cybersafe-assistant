name: ci

# Âmbito: build:all + testes dirigidos + suíte desktop. NÃO é packaging
# completo: compila apenas o launcher nativo de ensaio, não provisiona ClamAV/YARA, não gera NSIS
# nem mede o payload. Esses gates são locais/Windows com freeze aprovado.
on:
  push:
    branches: [main, "pap/**", "codex/**", "freebuff/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-smoke:
    name: Linux build, Unix IPC and native scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies without native lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the pinned esbuild used by tsx
        run: node node_modules/esbuild/install.js
      - name: Install the classic YARA required by corpus regression tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends yara
      - name: Build all workspaces and check desktop types
        run: |
          npm run build:all
          npm run typecheck -w @cybersafe/desktop
      - name: Build the Linux native scanner
        run: |
          cmake -S packages/native-engine -B packages/native-engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build packages/native-engine/build --parallel 2
      - name: Linux packaging contracts and authenticated Nigor client
        run: |
          node --test scripts/test/linux-lite-package*.test.mjs scripts/test/linux-lite-arch-*.test.mjs
          CYBERSAFE_TEST_LINUX_NATIVE=1 node --test packages/service/test/linux-native-arch.test.js
          node --test packages/desktop/test/nigor-status-integration.test.mjs packages/desktop/test/nigor-actions.test.mjs
      - name: POSIX service, freshness, authentication and definition regression tests
        run: >-
          node --test --test-concurrency=1
          packages/service/test/p3-scan-walk-pseudo-fs.test.js
          packages/service/test/p3-quarantine-mount-points.test.js
          packages/service/test/p3-quarantine-mount-engine.test.js
          packages/service/test/p3-quarantine-audit-engine.test.js
          packages/service/test/p3-usb-detection-posix.test.js
          packages/service/test/processes-list-contract.test.js
          packages/service/test/process-truth-ttl.test.js
          packages/service/test/qa3-native-result.test.js
          packages/service/test/s4-pipe-auth.test.js
          packages/service/test/freshclam-cooldown.test.js
          packages/service/test/definitions-update-truth.test.js
          packages/service/test/p1-1-clam-db-gate.test.js
          packages/service/test/p1-1-error-live-child.test.js
      - name: Complete desktop suite on Linux
        run: npm test -w @cybersafe/desktop
      # This source/runtime job does not certify Arch packaging, graphical
      # Nigor/Wayland sessions, USB hardware or the full cross-platform suite.
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm-version` NÃO é entrada deste action: a run 41299179863 registou
          # `Unexpected input(s) 'npm-version', valid inputs are [...]` e usou o
          # npm que vem com o Node (11.19.1). O pin anterior nunca teve efeito, e
          # por isso a "falsificação" da hipótese feita em 5658878 era inválida.
          # A correção é outra: o `package-lock.json` foi regerado com npm 11.19.1
          # (o npm do runner), que materializa as entradas aninhadas
          # `@emnapi/core`/`@emnapi/runtime` da subárvore opcional
          # `@tailwindcss/oxide-wasm32-wasi` que um npm mais antigo podava.
          node-version: "24"
          cache: npm

      - name: Instalar dependências (sem scripts nativos)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build dos workspaces
        run: npm run build:all

      - name: Assinatura de release (unitário + segurança do workflow)
        run: node --test scripts/test/release-signing.test.mjs scripts/test/release-workflow-security.test.mjs

      - name: Definições — pin YARA, aprovadores do freeze e cadeia de release
        run: node --test scripts/test/yara-pin.test.mjs scripts/test/release-key-setup.test.mjs scripts/test/release-chain.test.mjs scripts/test/source-freeze-approvers.test.mjs packages/service/test/yara-pin-verificado.test.js

      - name: Vendor YARA e manifesto de packaging
        run: node --test scripts/test/7h-yara-vendor.test.mjs scripts/test/7h-packaging-manifest.test.mjs

      - name: YARA clássico e proveniência
        run: node --test packages/core/test/yara-classic-engine.test.js packages/core/test/yara-engine-provenance.test.js

      - name: Contratos Linux e cache do Scanner sem dependência de YARA no PATH
        run: node --test scripts/test/platform-build-bindings.test.mjs scripts/test/linux-lite-package-renderer-guard.test.mjs scripts/test/linux-lite-package-api-guard.test.mjs packages/service/test/scan-post-batch-no-double-clamav.test.js

      - name: Suíte da aplicação e integração visual do atualizador
        run: npm test -w @cybersafe/app

      - name: Rebuild limpo do launcher e gates de payload
        run: node --test scripts/test/windows-launcher-proof.test.mjs

      - name: Launcher Windows e ensaio isolado de handoff (sem instalar)
        run: node scripts/test-updater-handoff-lab.mjs

      - name: Preview nativo com chave RFC e simulador inerte (sem instalar)
        run: node scripts/test-preview-handoff-lab.mjs

      - name: Exclusão de análises durante atualização
        run: node --test packages/service/test/update-scan-lease.test.js

      - name: Suíte do desktop
        run: npm test -w @cybersafe/desktop

