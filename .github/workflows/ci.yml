name: ci

# Âmbito: build:all + testes dirigidos + suíte desktop. NÃO é packaging
# completo: não builda native-engine, não provisiona ClamAV/YARA, não gera NSIS
# nem mede o payload. Esses gates são locais/Windows com freeze aprovado.
on:
  push:
    branches: [main, "pap/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # O `package-lock.json` é validado por este npm: `npm ci` é estrito com
          # as arestas opcionais `@emnapi/core`/`@emnapi/runtime` e falha com
          # EUSAGE noutro menor (medido na run 41298854964, 2026-11-01). Fixar o
          # npm é o que torna a instalação reproduzível; mudar aqui obriga a
          # regenerar o lock com o mesmo npm.
          npm-version: "11.6.2"
          cache: npm

      - name: Instalar dependências (sem scripts nativos)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build dos workspaces
        run: npm run build:all

      - name: Assinatura de release (unitário + segurança do workflow)
        run: node --test scripts/test/release-signing.test.mjs scripts/test/release-workflow-security.test.mjs

      - name: Vendor YARA e manifesto de packaging
        run: node --test scripts/test/7h-yara-vendor.test.mjs scripts/test/7h-packaging-manifest.test.mjs

      - name: YARA clássico e proveniência
        run: node --test packages/core/test/yara-classic-engine.test.js packages/core/test/yara-engine-provenance.test.js

      - name: Suíte do desktop
        run: npm test -w @cybersafe/desktop

